<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Un selector de colores RGB sencillo y visual." />
    <title>RGB Selector</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="overline">Herramienta de color</p>
        <h1>RGB Selector</h1>
        <p class="intro">Crea el color que necesitas ajustando sus canales RGB.</p>
      </header>

      <section class="selector" aria-label="Selector RGB">
        <div class="preview" id="color-preview">
          <span id="preview-hex">#6E4CFF</span>
        </div>
        <div class="controls">
          <div class="controls-heading">
            <h2>Canales RGB</h2>
            <button id="random-color" type="button">Color aleatorio</button>
          </div>
          <div class="channel-list">
            <label class="channel">
              <span>Rojo</span>
              <input id="red" type="range" min="0" max="255" value="110" />
              <output id="red-value">110</output>
            </label>
            <label class="channel">
              <span>Verde</span>
              <input id="green" type="range" min="0" max="255" value="76" />
              <output id="green-value">76</output>
            </label>
            <label class="channel">
              <span>Azul</span>
              <input id="blue" type="range" min="0" max="255" value="255" />
              <output id="blue-value">255</output>
            </label>
          </div>
          <label class="hex-field">
            <span>Valor HEX</span>
            <input id="hex-input" type="text" value="6E4CFF" maxlength="6" spellcheck="false" />
          </label>
          <button class="save-color" id="save-color" type="button">Guardar color</button>
        </div>
      </section>

      <section class="saved-section" aria-labelledby="saved-title">
        <div class="section-heading">
          <div>
            <p class="overline">Tu colección</p>
            <h2 id="saved-title">Colores guardados</h2>
          </div>
          <span id="saved-count">0 colores</span>
        </div>
        <div class="saved-colors" id="saved-colors">
          <p class="empty-message" id="empty-message">Todavía no tienes colores guardados.</p>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
